org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# connectedDebugAndroidTest normally uninstalls the app when it finishes, which would delete a debug
# install's settings on whatever device it ran on. Keep it installed: the device tests use their own
# files and Keystore alias, so the app's own data is left as it was.
android.injected.androidTest.leaveApksInstalledAfterRun=true
